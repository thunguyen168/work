# Render Blueprint - Configuration for deployment
# This file tells Render how to build and run your app

services:
  - type: web
    name: ai-foresight-scanner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ANTHROPIC_API_KEY
        sync: false  # You'll set this in Render dashboard
      - key: SERPER_API_KEY
        sync: false  # You'll set this in Render dashboard (or use BRAVE_API_KEY)
    healthCheckPath: /health
